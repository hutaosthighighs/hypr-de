source = ~/.config/hypr/visual/colors.conf

background {
  monitor =
  path = screenshot
  blur_passes = 3
  brightness = 0.8
  vibrancy = 0.2
  vibrancy_darkness = 0.2
}

general {
  hide_cursor = true
  ignore_empty_input = true
  fail_timeout = 1000
}

input-field {
  monitor =
  size = 250, 60
  halign = center
  valign = center

  outline_thickness = 2
  outer_color = $outline
  inner_color = $surface_container_low

  dots_size = 0.2
  dots_spacing = 0.35
  dots_center = true
  font_color = $on_surface 

  fade_on_empty = false
  rounding = -1
  check_color = $on_error

  placeholder_text = 
  fail_text = 
  hide_input = false
  position = 0, -200

}

# TIME
label {
  monitor = 
  text = cmd[update:1000] date +"%H:%M"
  color = $on_surface
  font_size = 90
  font_family = Maple Mono

  position = 0, 300
  halign = center
  valign = center
}

# DATE
label {
  monitor =
  text = cmd[update:1000] echo "$(date +"%A, %B %d")"
  color = $on_surface
  font_size = 20
  font_family = Maple Mono

  position = 0, 200
  halign = center
  valign = center
}


# BATTERY (I don't know if this works) update: IT SOMEHOW WORKS
label {
  monitor = 

  text = cmd[update:10000] ~/.scripts/battery-status

  color = $on_surface
  font_size = 25
  font_family = Maple Mono

  halign = center
  valign = center
  position = 0, -300
}
