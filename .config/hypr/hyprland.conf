
# This is an example Hyprland config file, 
# starting from the default hyprland config file, eddited by me :P
# Refer to the wiki for more information.
# https://wiki.hypr.land/Configuring/

# Please note not all available settings / options are set here.
# For a full list, see the wiki



################
### SOURCES ####
################

source = ~/.config/hypr/animations.conf
source = ~/.config/hypr/keybinds.conf

################
### MONITORS ###
################ 

# See https://wiki.hypr.land/Configuring/Monitors/

# Use hyprctl monitors to get active monitor name and other specifications
# monitor = name, resolution@refresh-rate, position, scale

monitor=HDMI-A-1,1920x1080@144,0x0,1


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

exec-once = systemctl --user start xdg-desktop-portal-hyprland 2>~/hyprlog.txt # temporary log file
exec-shutdown = systemctl --user stop xdg-desktop-portal-hyprland 2>~/hyprlog.txt

exec-once = hyprpaper
exec-once = systemctl --user start hyprpolkitagent
# exec-once = quickshell

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hypr.land/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia

###################
### PERMISSIONS ###
###################




#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hypr.land/Configuring/Variables/

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in = 4
    gaps_out = 8
    float_gaps = 8

    border_size = 1

    # https://wiki.hypr.land/Configuring/Variables/#variable-types
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    resize_on_border = false

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle

    snap{
        enabled = true
        respect_gaps = true
        monitor_gap = 8
    }
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 10
    rounding_power = 2


    active_opacity = 1.0
    inactive_opacity = 0.9

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hypr.land/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 2

        vibrancy = 0.1696
    }
}

# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true
    preserve_split = true
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(

    session_lock_xray = true
}

xwayland{
    enabled = true
    create_abstract_socket = true
}

render{
    direct_scanout = 2 # remove if experiencing screentears
}

ecosystem{
    no_update_news = true
    no_donation_nag = true
}


#############
### INPUT ###
#############

# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = us
    numlock_by_default = true


    follow_mouse = 1
    sensitivity = 0
    scroll_method = 2fg

    touchpad {
        natural_scroll = false
        clickfinger_behavior = true
        drag_3fg = 1
    }
}

# See https://wiki.hypr.land/Configuring/Gestures
gesture = 3, horizontal, workspace



##############################
### WINDOWS AND WORKSPACES ###
##############################

# Ref https://wiki.hypr.land/Configuring/Workspace-Rules/

# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0
windowrule = float, title:(?i).*non-steam game*
windowrule = renderunfocused, class:^(steam_app_.*)$