source = ./visual/colors.conf

source = ~/.config/hypr/variables.conf
source = ~/.config/hypr/autostart.conf
source = ~/.config/hypr/binds.conf

source = ~/.config/hypr/visual/general.conf
source = ~/.config/hypr/visual/decoration.conf
source = ~/.config/hypr/visual/layout.conf
source = ~/.config/hypr/visual/animations.conf



# MONITOR
monitor = eDP-1, 2560x1600@120Hz, 0x0, 1.00

# WORKSPACE RULES


# WINDOW RULES

windowrule = no_focus on, match:class ^$, match:title ^$, match:xwayland 1, match:float 1, match:fullscreen 0, match:pin 0
windowrule = float on, match:class com.github.binarylinuxx.hyprland-settings, match:title Hyprland Settings
windowrule = render_unfocused on , match:class ^(steam_app_.*)$




# FILE SELECTOR WINDOW RULES (at least for vscode, didn't test it anywhere else)
  windowrule = float on, match:title ^(Open File|Open Files|Open Folder)$
  windowrule = center on, match:title ^(Open File|Open Files|Open Folder)$
  windowrule = stay_focused on, match:title ^(Open File|Open Files|Open Folder)$
  windowrule = pin on, match:title ^(Open File|Open Files|Open Folder)$

