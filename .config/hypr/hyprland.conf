source = colors.conf

source = ~/.config/hypr/variables.conf
source = ~/.config/hypr/autostart.conf
source = ~/.config/hypr/binds.conf

source = ~/.config/hypr/visual/general.conf
source = ~/.config/hypr/visual/decoration.conf
source = ~/.config/hypr/visual/layout.conf
source = ~/.config/hypr/visual/animations.conf



# MONITOR
monitor = HDMI-A-1, 1920x1080@144Hz, 0x0, 1.00

# WORKSPACE RULES
workspace = 1, persistent:1

# WINDOW RULES
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0
windowrule = float, class:com.github.binarylinuxx.hyprland-settings, title:Hyprland Settings
#windowrule = float, class:org.quickshell, title:Settings
#windowrule = noblur, class:kando
#windowrule = opaque, class:kando
#windowrule = size 100% 100%, class:kando
#windowrule = noborder, class:kando
#windowrule = noanim, class:kando
#windowrule = float, class:kando
#windowrule = pin, class:kando
#windowrule = opacity 0.8 0.8, class:^(Firefox|firefox)$


# LAYER RULES

    # Waybar and notifications
    layerrule = blur, waybar
    #layerrule = blur, ignis
    #layerrule = blur, swaync-control-center
    #layerrule = blur, swaync-notification-window
    #layerrule = ignorezero, swaync-control-center
    #layerrule = ignorezero, swaync-notification-window

    # Wlogout
    layerrule = blur, wlogout

    # Rofi (simplified)
    #layerrule = blur, rofi
    #layerrule = ignorezero, rofi  # Fixes rounded corners



